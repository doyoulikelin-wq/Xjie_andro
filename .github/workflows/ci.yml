name: Xjie Android CI

on:
  push:
    branches: [main]
    paths:
      - "Android/**"
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Android/**"
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android compile platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify exact Python quality-tool inventory
        run: python3 tools/verify_python_test_inventory.py --run

      - name: Verify declared JVM test inventory
        run: python3 tools/verify_jvm_test_inventory.py

      - name: Run JVM tests, assemble, and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug

      - name: Verify exact executed JVM test inventory
        run: >-
          python3 tools/verify_jvm_test_inventory.py
          --results app/build/test-results/testDebugUnitTest

  backend-exact-test:
    name: Backend 3.11 production-image exact tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build pinned production backend image
        env:
          BACKEND_IMAGE: xjie-android-backend-ci:${{ github.sha }}
        run: >-
          docker build
          --pull
          --platform linux/amd64
          --label org.opencontainers.image.revision=${{ github.sha }}
          --tag "$BACKEND_IMAGE"
          backend

      - name: Verify locked runtime and exact backend unit inventory
        env:
          BACKEND_IMAGE: xjie-android-backend-ci:${{ github.sha }}
        run: |
          set -euo pipefail
          result_dir="$RUNNER_TEMP/xjie-backend-results"
          install -d -m 0777 "$result_dir"
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$result_dir,target=/results" \
            --workdir /workspace \
            --entrypoint python \
            "$BACKEND_IMAGE" \
            -I -c 'import importlib.metadata,sys; assert sys.version_info[:3] == (3,11,15); assert importlib.metadata.version("pip") == "26.1.2"'
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$result_dir,target=/results" \
            --workdir /workspace \
            --entrypoint python \
            "$BACKEND_IMAGE" \
            -I Android/tools/verify_backend_python_test_inventory.py \
            --run \
            --junit /results/backend-unit-results.xml

      - name: Upload exact backend JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-results
          path: ${{ runner.temp }}/xjie-backend-results/backend-unit-results.xml
          if-no-files-found: error

  android-connected-ui:
    name: API 35 deterministic UI profiles
    needs: android-build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_BASE_URL_DEBUG: https://www.jianjieaitech.com/api
    defaults:
      run:
        working-directory: Android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android compile platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify declared connected-test inventory
        run: python3 tools/verify_android_ui_test_inventory.py

      - name: Initialize connected-test evidence
        run: |
          mkdir -p build/quality/android-ui
          printf 'phase=pre-emulator\n' > build/quality/android-ui/run-status.txt

      - name: Require KVM acceleration
        run: |
          set -euo pipefail
          test -c /dev/kvm
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run standard, compact, and large-text deterministic UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: cd Android && bash tools/run_connected_ui_profiles.sh

      - name: Upload connected-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-profile-results
          path: Android/build/quality/android-ui
          if-no-files-found: error
